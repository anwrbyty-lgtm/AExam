name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Flutter Project and Copy Files
        run: |
          # إنشاء مشروع Flutter جديد فارغ في مجلد مؤقت
          flutter create --project-name exam_editor temp_app
          # نسخ ملفاتك إلى المشروع الجديد
          cp -r lib temp_app/
          cp pubspec.yaml temp_app/
          cp -r assets temp_app/

      - name: Build APK
        run: |
          cd temp_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: exam-editor-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
